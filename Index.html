<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spaceship Flight Simulator</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #000;
      font-family: monospace;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="canvas-container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { SpaceshipModel } from './JS/SpaceshipModel.js';

    // 1. SCENE & RENDERER SETUP
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x050810, 0.003);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x050810, 1);
    container.appendChild(renderer.domElement);

    // 2. SHIP & CAMERA HIERARCHY
    const shipGroup = new THREE.Group();
    scene.add(shipGroup);

    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 0);
    shipGroup.add(camera);

    const spaceship = new SpaceshipModel();
    shipGroup.add(spaceship.group);

    // 3. BRIGHT TESTING LIGHTS
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444455, 1.8);
    scene.add(hemiLight);

    const mainLight = new THREE.DirectionalLight(0xffffff, 2.5);
    mainLight.position.set(10, 20, 15);
    scene.add(mainLight);

    const interiorLight = new THREE.PointLight(0xe0f4ff, 2.5, 4.0);
    interiorLight.position.set(0, 0.5, -0.2);
    shipGroup.add(interiorLight);

    // 4. UNIFIED MOUSE CONTROLS SETUP
    const mouse = { x: 0, y: 0, targetX: 0, targetY: 0 };

    window.addEventListener('mousemove', (e) => {
      mouse.targetX = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.targetY = -(e.clientY / window.innerHeight) * 2 + 1;
    });

    // Control parameters
    const maxCameraYaw = Math.PI * 0.25;   // Capped at 45° left / 45° right (90° total field sweep)
    const maxCameraPitch = Math.PI * 0.15; // Capped at ~27° up / down
    const shipTurnSpeed = 0.8;            // Steadier, gentler steering speed
    const flySpeed = 7.0;                  // Forward speed
    const forwardVector = new THREE.Vector3();

    // 5. ANIMATION LOOP
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const time = clock.getElapsedTime();

      // Smooth mouse interpolation
      mouse.x += (mouse.targetX - mouse.x) * 0.08;
      mouse.y += (mouse.targetY - mouse.y) * 0.08;

      // A. CAMERA FREELOOK (Look-around capped strictly to 90° arc)
      camera.rotation.y = -mouse.x * maxCameraYaw;
      camera.rotation.x = mouse.y * maxCameraPitch;
      camera.rotation.z = -mouse.x * 0.08;

      // B. SHIP STEERING (Turns ship in same direction at gentler rate)
      shipGroup.rotation.y -= mouse.x * shipTurnSpeed * delta;
      shipGroup.rotation.x += mouse.y * shipTurnSpeed * delta;
      shipGroup.rotation.z = -mouse.x * 0.22;

      // C. FORWARD FLIGHT MOVEMENT
      forwardVector.set(0, 0, -1).applyQuaternion(shipGroup.quaternion);
      shipGroup.position.addScaledVector(forwardVector, flySpeed * delta);

      spaceship.update(time);

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    });

    animate();
  </script>
</body>
</html>
