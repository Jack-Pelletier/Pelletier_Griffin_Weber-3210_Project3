
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spaceship Wowie</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #000;
      font-family: monospace;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
  <script src="./JS/SpaceshipModel.js"></script>
  <script src="./JS/Asteroids.js"></script>
  <script src="./JS/Main.js"></script>

  <script>

    // 1. SCENE & RENDERER SETUP
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x050810, 0.003);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x050810, 1);
    container.appendChild(renderer.domElement);

    // 2. SHIP & CAMERA HIERARCHY
    const shipGroup = new THREE.Group();
    scene.add(shipGroup);

    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 0);
    shipGroup.add(camera);

    const spaceship = new SpaceshipModel();
    shipGroup.add(spaceship.group);

    // LIGHTS FOR TESTING
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444455, 1.8);
    scene.add(hemiLight);

    const mainLight = new THREE.DirectionalLight(0xffffff, 2.5);
    mainLight.position.set(10, 20, 15);
    scene.add(mainLight);

    const interiorLight = new THREE.PointLight(0xe0f4ff, 2.5, 4.0);
    interiorLight.position.set(0, 0.5, -0.2);
    shipGroup.add(interiorLight);

    // Create the asteroid field
    const asteroidField = createSpaceEnvironment(scene);

    // mouse controls for camera
    const mouse = { x: 0, y: 0, targetX: 0, targetY: 0 };

    window.addEventListener('mousemove', (e) => {
      mouse.targetX = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.targetY = -(e.clientY / window.innerHeight) * 2 + 1;
    });

    // control parameters
    const maxCameraYaw = Math.PI * 0.25;   // 45 degrees left and right cap
    const maxCameraPitch = Math.PI * 0.15; // roughly 27 degrees up and down
    const shipTurnSpeed = 0.8;            // steering speed
    const flySpeed = 7.0;                  // forward speed
    const forwardVector = new THREE.Vector3();

    // 5. ANIMATION LOOP
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const time = clock.getElapsedTime();

      // mouth interloptation
      mouse.x += (mouse.targetX - mouse.x) * 0.08;
      mouse.y += (mouse.targetY - mouse.y) * 0.08;

      // user camera look 
      camera.rotation.y = -mouse.x * maxCameraYaw;
      camera.rotation.x = mouse.y * maxCameraPitch;
      camera.rotation.z = -mouse.x * 0.08;

      // ship steering movement (reduced compared to camera)
      shipGroup.rotation.y -= mouse.x * shipTurnSpeed * delta;
      shipGroup.rotation.x += mouse.y * shipTurnSpeed * delta;
      shipGroup.rotation.z = -mouse.x * 0.22;

      // forward movement
      forwardVector.set(0, 0, -1).applyQuaternion(shipGroup.quaternion);
      shipGroup.position.addScaledVector(forwardVector, flySpeed * delta);

      spaceship.update(time);

      // Update the asteroid field
      updateSpaceEnvironment(asteroidField, camera, time, delta);

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    });

    animate();
  </script>
</body>
</html>
