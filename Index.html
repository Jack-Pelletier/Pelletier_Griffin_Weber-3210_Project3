<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Definitely Spaceship Pilot Certified</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #000;
      font-family: monospace;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
    }
    /* white border around rear-view viewport */
    #rear-view-border {
      position: absolute;
      top: 25px;
      left: 50%;
      transform: translateX(-50%);
      width: 22vw;
      height: 14vh;
      border: 2px solid #ffffff;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.4);
      pointer-events: none;
      box-sizing: border-box;
      border-radius: 2px;
    }
    /* controls HUD display at the bottom center of screen */
    #hud-controls {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: #ffffff;
      font-family: monospace;
      font-size: 13px;
      letter-spacing: 1px;
      text-align: center;
      pointer-events: none;
      background: rgba(2, 10, 20, 0.85);
      padding: 8px 18px;
      border: 1px solid #ffffff;
      border-radius: 4px;
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.3);
      user-select: none;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  
  <!-- rear camera UI border -->
  <div id="rear-view-border"></div>

  <!-- bottom screen controls overlay -->
  <div id="hud-controls">
    MOUSE: LOOK / STEER &nbsp;|&nbsp; HOLD LMB: BOOST ENGINE
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
  <script src="./JS/SpaceshipModel.js"></script>
  <script src="./JS/Asteroids.js"></script>
  <script src="./JS/SpaceShader.js"></script>
  <script src="./JS/Main.js"></script>

  <script>
    // 1. SCENE & RENDERER SETUP
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x050810, 0.003);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x050810, 1);
    container.appendChild(renderer.domElement);

    // 2. SHIP & CAMERAS HIERARCHY
    const shipGroup = new THREE.Group();
    scene.add(shipGroup);

    // Primary Forward View Camera
    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 0);
    shipGroup.add(camera);

    // Secondary Rear-View Camera
    const rearCamera = new THREE.PerspectiveCamera(60, 2.2, 0.1, 1000);
    rearCamera.position.set(0, 0, 0);
    rearCamera.rotation.y = Math.PI; // Face 180 degrees backward
    shipGroup.add(rearCamera);

    const spaceship = new SpaceshipModel();
    shipGroup.add(spaceship.group);

    // LIGHTS
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444455, 1.8);
    scene.add(hemiLight);

    const mainLight = new THREE.DirectionalLight(0xffffff, 2.5);
    mainLight.position.set(10, 20, 15);
    scene.add(mainLight);

    const interiorLight = new THREE.PointLight(0xe0f4ff, 2.5, 4.0);
    interiorLight.position.set(0, 0.5, -0.2);
    shipGroup.add(interiorLight);

    // Create space environment
    const asteroidField = createSpaceEnvironment(scene);

    // Mouse & Boost control tracking
    const mouse = { x: 0, y: 0, targetX: 0, targetY: 0 };
    let isBoosting = false;

    window.addEventListener('mousemove', (e) => {
      mouse.targetX = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.targetY = -(e.clientY / window.innerHeight) * 2 + 1;
    });

    // LMB to boost
    window.addEventListener('mousedown', (e) => {
      if (e.button === 0) isBoosting = true;
    });

    window.addEventListener('mouseup', (e) => {
      if (e.button === 0) isBoosting = false;
    });

    // ship control parameters
    const maxCameraYaw = Math.PI * 0.25;   
    const maxCameraPitch = Math.PI * 0.15; 
    const shipTurnSpeed = 0.8;   
    
    // speed variables for engine boost
    const baseSpeed = 7.0;
    const boostSpeed = 22.0;
    let currentSpeed = baseSpeed;

    const forwardVector = new THREE.Vector3();

    // 5. ANIMATION & RENDER LOOP
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const time = clock.getElapsedTime();

      // Mouse interpolation
      mouse.x += (mouse.targetX - mouse.x) * 0.08;
      mouse.y += (mouse.targetY - mouse.y) * 0.08;

      // User camera freelook
      camera.rotation.y = -mouse.x * maxCameraYaw;
      camera.rotation.x = mouse.y * maxCameraPitch;
      camera.rotation.z = -mouse.x * 0.08;

      // Ship steering movement
      shipGroup.rotation.y -= mouse.x * shipTurnSpeed * delta;
      shipGroup.rotation.x += mouse.y * shipTurnSpeed * delta;
      shipGroup.rotation.z = -mouse.x * 0.22;

      // Smooth acceleration / deceleration when holding LMB
      const targetSpeed = isBoosting ? boostSpeed : baseSpeed;
      currentSpeed += (targetSpeed - currentSpeed) * 0.08;

      // Forward movement
      forwardVector.set(0, 0, -1).applyQuaternion(shipGroup.quaternion);
      shipGroup.position.addScaledVector(forwardVector, currentSpeed * delta);

      // Model shader & animation updates
      spaceship.update(time);

      // Update space environment & collision checks
      updateSpaceEnvironment(asteroidField, camera, time, delta);
      detectCollisions(asteroidField, spaceship, time);

      // rasterization with dual viewports
      const w = window.innerWidth;
      const h = window.innerHeight;

      // fullscreen main forward viewport
      renderer.setViewport(0, 0, w, h);
      renderer.setScissorTest(false);
      renderer.render(scene, camera);

      // rear-view mirror scissor viewport
      const mirrorW = Math.floor(w * 0.22);
      const mirrorH = Math.floor(h * 0.14);
      const mirrorX = Math.floor((w - mirrorW) / 2);
      const mirrorY = Math.floor(h - mirrorH - 25);

      renderer.setClearColor(0x020308, 1);
      renderer.setViewport(mirrorX, mirrorY, mirrorW, mirrorH);
      renderer.setScissor(mirrorX, mirrorY, mirrorW, mirrorH);
      renderer.setScissorTest(true);

      // render backward-facing view
      renderer.render(scene, rearCamera);
    }

    window.addEventListener('resize', () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      rearCamera.aspect = 2.2;
      rearCamera.updateProjectionMatrix();
      renderer.setSize(w, h);
    });

    animate();
  </script>
</body>
</html>
